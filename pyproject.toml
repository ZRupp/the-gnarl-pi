[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-gnarl-pi"
version = "0.1.0"
description = "Raspberry Pi hardware synthesizer for grungy, dirty sounds"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "The Gnarl Pi Contributors"}
]
keywords = ["synthesizer", "raspberry-pi", "midi", "audio", "hardware", "music"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "gpiozero>=2.0",
    "RPi.GPIO>=0.7.1",
    "RPLCD>=1.3.0",
    "smbus2>=0.4.0",
    "spidev>=3.6",
    "python-rtmidi>=1.5.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "pyalsaaudio>=0.10.0",
    "JACK-Client>=0.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
    "mypy>=1.5.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
gnarl = "gnarl.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/the-gnarl-pi"
Repository = "https://github.com/YOUR_USERNAME/the-gnarl-pi"
Issues = "https://github.com/YOUR_USERNAME/the-gnarl-pi/issues"

[tool.setuptools]
packages = ["gnarl"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
gnarl = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "gpiozero.*",
    "RPi.GPIO.*",
    "RPLCD.*",
    "smbus2.*",
    "spidev.*",
    "rtmidi.*",
    "alsaaudio.*",
    "jack.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=gnarl --cov-report=html --cov-report=term"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/gnarl"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
